name: Build Proton

# This is intentionally a single, self-contained workflow so that it can be
# reproduced locally with `act`. Point act at this file explicitly:
#
#   act -W .github/workflows/release.yml -j build
#
# Add --artifact-server-path if you want act to collect the build artifacts:
#
#   act -W .github/workflows/release.yml -j build \
#       --artifact-server-path /tmp/act-artifacts
#
# The repository's .actrc already sets -W to this workflow.
#
# The build runs inside the official Proton SDK image instead of starting a
# Docker container from inside the job, so no Docker socket or
# Docker-in-Docker setup is required.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - p5r-ge11-12
    tags:
      - 'GE-Proton*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep this in sync with Makefile.in's STEAMRT_IMAGE.
  PROTON_SDK_IMAGE: registry.gitlab.steamos.cloud/proton/steamrt4/sdk/x86_64:4.0.20260714.251823-0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/proton/steamrt4/sdk/x86_64:4.0.20260714.251823-0
    outputs:
      name: ${{ steps.build_name.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Checkout submodules
        run: git submodule update --init --recursive --filter=tree:0

      - name: Determine build name
        id: build_name
        run: echo "name=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Apply Proton-GE patches
        run: |
          # The patch stack mirrors the upstream GE build. Individual optional
          # patches are allowed to fail; any failure here is visible in the log.
          ./patches/protonprep-valve-staging.sh || true
          # Strip binaries at compile time to save space.
          patch -Np1 -i .github/patches/0001-build-strip-binaries-early.patch
          mkdir -p build

      - name: Verify Wine 7 CPU patch
        run: |
          # This patch is the entire point of this fork; never let a rebase or
          # fuzz failure silently produce a build without it.
          grep -q 'Wine 7 semantics: WINE_CPU_TOPOLOGY must contain' \
            wine/dlls/ntdll/unix/system.c
          ! grep -q 'performance_cores\|/sys/devices/cpu_core/cpus' \
            wine/dlls/ntdll/unix/system.c

      - name: Verify Wine 7 sync semantics
        run: |
          # The yield/delay/signal-and-wait restore is what closes the remaining
          # Persona 5 Royal CPU regression; never let it regress silently.
          grep -q 'Wine 7 semantics: a yield is always reported' \
            wine/dlls/ntdll/unix/sync.c
          grep -q 'Wine 7 used usleep(0) here' \
            wine/dlls/ntdll/unix/sync.c
          ! grep -q 'RUSAGE_THREAD' \
            wine/dlls/ntdll/unix/sync.c
          grep -q 'Wine 7 always performed the signal and wait atomically' \
            wine/dlls/ntdll/unix/sync.c

      - name: Verify fsync default
        run: |
          # Persona 5 Royal: the build must default to fsync, not ntsync.
          grep -q 'P5R build: default to the Wine 7-era fsync backend' \
            proton
          grep -q 'PROTON_ENABLE_NTSYNC' \
            proton

      - name: Configure
        working-directory: build
        run: |
          ../configure.sh \
            --build-name="${{ steps.build_name.outputs.name }}" \
            --no-proton-sdk

      - name: Build
        working-directory: build
        run: make -j"$(nproc)" redist

      - name: Install Node.js for act
        if: ${{ env.ACT }}
        run: |
          # act runs JavaScript actions (upload-artifact) inside this container,
          # but the SDK image does not ship Node.js. GitHub-hosted runners
          # inject it; act does not.
          if ! command -v node >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs
          fi

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_name.outputs.name }}
          path: |
            build/${{ steps.build_name.outputs.name }}.tar.gz
            build/${{ steps.build_name.outputs.name }}.sha512sum
            build/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}
          path: artifacts

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --latest \
              --title "$GITHUB_REF_NAME Released" --notes-from-tag --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
