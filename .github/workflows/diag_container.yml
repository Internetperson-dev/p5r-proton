name: Diag Container

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'GE-Proton*'
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTON_SDK_IMAGE: registry.gitlab.steamos.cloud/proton/steamrt4/sdk/x86_64:4.0.20260714.251823-0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/proton/steamrt4/sdk/x86_64:4.0.20260714.251823-0
    steps:
      - run: echo ok
