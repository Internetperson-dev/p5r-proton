name: Diag Release

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'GE-Proton*'
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTON_SDK_IMAGE: registry.gitlab.steamos.cloud/proton/steamrt4/sdk/x86_64:4.0.20260714.251823-0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.build_name.outputs.name }}
    steps:
      - id: build_name
        run: echo "name=test" >> "$GITHUB_OUTPUT"
      - run: echo ok

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.name }}
          path: artifacts
      - run: echo ok
