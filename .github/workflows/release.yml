name: Release

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt update && sudo apt-get install -y ccache fontforge-nox nasm yasm python3-pip ninja-build
        sudo pip3 install --upgrade meson
    - name: Apply patches
      run: ./patches/protonprep-valve-staging.sh || true
    - name: Create build dir
      run: mkdir -p build
    - name: Configure
      working-directory: ./build
      run: ../configure.sh --build-name="proton-build" --enable-ccache
      env:
        protonsdk_version: ""
    - name: Build
      working-directory: ./build
      run: make dist
      env:
        protonsdk_version: ""
    - name: Archive
      working-directory: ./build
      run: tar --exclude-vcs --exclude='.git' -czvf proton.tar.gz dist
    - uses: actions/upload-artifact@v4
      with:
        name: proton-x86_64
        path: build/proton.tar.gz
