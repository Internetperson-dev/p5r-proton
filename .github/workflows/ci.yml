name: CI

# Every push and pull request is built here in GitHub Actions, so changes are
# checked on the remote runner instead of with a local `act` invocation. The
# job runs inside the official Proton SDK image; no Docker socket or
# Docker-in-Docker setup is required. Pushing a GE-Proton* tag additionally
# publishes the build as a GitHub release.

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'GE-Proton*'
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep this in sync with Makefile.in's STEAMRT_IMAGE.
  PROTON_SDK_IMAGE: registry.gitlab.steamos.cloud/proton/steamrt4/sdk/x86_64:4.0.20260714.251823-0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/proton/steamrt4/sdk/x86_64:4.0.20260714.251823-0
    outputs:
      name: ${{ steps.build_name.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Mark workspace as safe
        # The runner mounts the workspace with a different owner than the SDK
        # image's user, so git refuses to touch it until it is marked safe.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout submodules
        run: git submodule update --init --recursive --filter=tree:0

      - name: Determine build name
        id: build_name
        run: echo "name=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Apply Proton-GE patches
        run: |
          # The patch stack mirrors the upstream GE build. Individual optional
          # patches are allowed to fail; any failure here is visible in the log.
          ./patches/protonprep-valve-staging.sh || true
          # Strip binaries at compile time to save space.
          patch -Np1 -i .github/patches/0001-build-strip-binaries-early.patch
          mkdir -p build

      - name: Verify Wine 7 CPU patch
        run: |
          # This patch is the entire point of this fork; never let a rebase or
          # fuzz failure silently produce a build without it.
          grep -q 'Wine 7 semantics: WINE_CPU_TOPOLOGY must contain' \
            wine/dlls/ntdll/unix/system.c
          ! grep -q 'performance_cores\|/sys/devices/cpu_core/cpus' \
            wine/dlls/ntdll/unix/system.c

      - name: Verify Wine 7 sync semantics
        run: |
          # The yield/delay/signal-and-wait restore is what closes the remaining
          # Persona 5 Royal CPU regression; never let it regress silently.
          grep -q 'Wine 7 semantics: a yield is always reported' \
            wine/dlls/ntdll/unix/sync.c
          grep -q 'Wine 7 used usleep(0) here' \
            wine/dlls/ntdll/unix/sync.c
          ! grep -q 'RUSAGE_THREAD' \
            wine/dlls/ntdll/unix/sync.c
          grep -q 'Wine 7 always performed the signal and wait atomically' \
            wine/dlls/ntdll/unix/sync.c

      - name: Verify fsync default
        run: |
          # Persona 5 Royal: the build must default to fsync, not ntsync.
          grep -q 'P5R build: default to the Wine 7-era fsync backend' \
            proton
          grep -q 'PROTON_ENABLE_NTSYNC' \
            proton
          grep -q 'self.env\["PROTON_NO_NTSYNC"\] = "1"' \
            proton
          grep -q 'self.env\["PROTON_NO_NTSYNC"\] = ""' \
            proton

      - name: Verify Wine 7 heap in-place resize
        run: |
          # The HeapReAlloc backport is part of the remaining Persona 5 Royal
          # CPU regression; never let a rebase or patch drop it.
          grep -q 'Wine 7 resized in place within the block' \
            wine/dlls/ntdll/heap.c
          ! grep -q 'as native LFH does it with different block size' \
            wine/dlls/ntdll/heap.c

      - name: Verify Wine 7 no-LFH heap
        run: |
          # The HeapReAlloc backport is part of the remaining Persona 5 Royal
          # CPU regression; never let a rebase or patch drop it.
          grep -q 'Wine 7 had no Low Fragmentation Heap' \
            wine/dlls/ntdll/heap.c
          ! grep -q 'WriteRelease( &bin->enabled, TRUE )' \
            wine/dlls/ntdll/heap.c
          ! grep -q 'RtlSetHeapInformation( heap, HeapCompatibilityInformation' \
            wine/dlls/ntdll/heap.c

      - name: Verify Wine 7 never uses CLOCK_MONOTONIC_RAW
        run: |
          # Proton 7 never queried the non-monotonic CLOCK_MONOTONIC_RAW for the
          # Win32 monotonic clock; the newer Wine base picked the raw clock again.
          # Never let that slip back in.
          ! grep -q '#ifdef CLOCK_MONOTONIC_RAW' \
            wine/dlls/ntdll/unix/sync.c
          ! grep -q '#ifdef CLOCK_MONOTONIC_RAW' \
            wine/server/request.c

      - name: Configure
        working-directory: build
        run: |
          ../configure.sh \
            --build-name="${{ steps.build_name.outputs.name }}" \
            --no-proton-sdk

      - name: Build
        working-directory: build
        run: make -j"$(nproc)" redist

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build_name.outputs.name }}
          path: |
            build/${{ steps.build_name.outputs.name }}.tar.gz
            build/${{ steps.build_name.outputs.name }}.sha512sum
            build/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.name }}
          path: artifacts

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --latest \
              --title "$GITHUB_REF_NAME Released" --notes-from-tag --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
