name: CI

# Every push and pull request is built here in GitHub Actions, so changes are
# checked on the remote runner instead of with a local `act` invocation. The
# job runs inside the official Proton SDK image; no Docker socket or
# Docker-in-Docker setup is required. Pushing a GE-Proton* tag additionally
# publishes the build as a GitHub release.

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'GE-Proton*'
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep this in sync with Makefile.in's STEAMRT_IMAGE.
  PROTON_SDK_IMAGE: registry.gitlab.steamos.cloud/proton/steamrt4/sdk/x86_64:4.0.20260714.251823-0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/proton/steamrt4/sdk/x86_64:4.0.20260714.251823-0
      # Docker 29's built-in seccomp profile denies the AF_UNIX socket() that
      # wineserver makes while generating default_pfx ("socket: Function not
      # implemented"). The other Proton build steps need no privileges, and a
      # full build takes hours, so make the socket work for the whole job.
      options: --security-opt seccomp=unconfined
    outputs:
      name: ${{ steps.build_name.outputs.name }}
    env:
      # Explicit paths so ccache/cargo and the cache actions agree even though
      # the build runs inside a container with HOME=/github/home.
      CCACHE_DIR: /github/home/.ccache
      CARGO_HOME: /github/home/.cargo
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Mark workspace as safe
        # The runner mounts the workspace with a different owner than the SDK
        # image's user, so git refuses to touch it until it is marked safe.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare Wine runtime
        # The SDK image has no systemd, so /etc/machine-id is missing and
        # wineserver's init_user_sid() warns while creating the prefix. Give
        # it a stable ID, then prove sockets work before the multi-hour build.
        run: |
          set -eu
          if [ ! -s /etc/machine-id ]; then
            printf '%s\n' 3f9a2b7c1d4e5f60829a3b4c5d6e7f80 > /etc/machine-id
          fi
          seccomp=$(awk '/^Seccomp:/ {print $2}' /proc/self/status)
          if [ "$seccomp" != "0" ]; then
            echo "seccomp is still active ($seccomp); wineserver sockets would fail" >&2
            exit 1
          fi
          python3 -c 'import socket; socket.socket(socket.AF_UNIX, socket.SOCK_STREAM).close()'
          echo "wineserver sockets are available"

      # Restore the compiler cache first. Proton enables ccache by default, so
      # with a warm cache a patch-only change recompiles only the objects whose
      # preprocessed source actually changed instead of the entire ~2h build.
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: /github/home/.ccache
          key: ccache-proton-${{ github.run_id }}
          restore-keys: |
            ccache-proton-

      # piper is a Rust crate; keep the downloaded crates so a rebuild does not
      # hit crates.io again.
      - name: Restore cargo registry
        id: cargo-restore
        uses: actions/cache/restore@v4
        with:
          path: /github/home/.cargo
          key: cargo-proton-${{ github.run_id }}
          restore-keys: |
            cargo-proton-

      - name: Restore submodule git objects
        id: submodules-restore
        uses: actions/cache/restore@v4
        with:
          # git submodule update fetches ~20 submodules (~3 minutes cold).
          # Keeping .git/modules lets it check out from local objects instead.
          path: .git/modules
          key: submodules-proton-${{ github.run_id }}
          restore-keys: |
            submodules-proton-

      - name: Configure build caches
        run: |
          set -eu
          mkdir -p "$CCACHE_DIR" "$CARGO_HOME"
          if command -v ccache >/dev/null 2>&1; then
            # Keep each cache well under the repository's 10 GB cache quota;
            # GitHub evicts the oldest ccache-proton-* entry automatically.
            ccache -M 4G
            ccache -z
            echo "ccache configuration:"
            ccache -p | head -20
          else
            echo "ccache not available; the build will proceed without it"
          fi

      - name: Checkout submodules
        run: git submodule update --init --recursive --filter=tree:0

      - name: Determine build name
        id: build_name
        run: echo "name=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Apply Proton-GE patches
        run: |
          # The patch stack mirrors the upstream GE build. Individual optional
          # patches are allowed to fail; any failure here is visible in the log.
          ./patches/protonprep-valve-staging.sh || true
          # Strip binaries at compile time to save space.
          patch -Np1 -i .github/patches/0001-build-strip-binaries-early.patch
          # Allow piper to use a supplied onnxruntime (upstream releases vanished).
          patch -p1 -d piper -i "$GITHUB_WORKSPACE/.github/patches/0002-piper-supply-onnxruntime.patch"
          mkdir -p build

      - name: Restore onnxruntime
        id: onnxruntime-restore
        uses: actions/cache/restore@v4
        with:
          path: onnxruntime
          key: onnxruntime-1.14.1

      - name: Provide onnxruntime for piper
        run: |
          # piper-phonemize downloads onnxruntime 1.14.1 from a GitHub release
          # that no longer exists. Build the same headers/library from the
          # NuGet package and point the patched piper build at them. The
          # extracted tree is immutable, so it is cached across runs.
          set -eu
          if [ -f "$GITHUB_WORKSPACE/onnxruntime/lib/libonnxruntime.so.1.14.1" ]; then
            echo "Using cached onnxruntime 1.14.1"
          else
            wget -q -O /tmp/onnxruntime.nupkg \
              https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.14.1/microsoft.ml.onnxruntime.1.14.1.nupkg
            mkdir -p "$GITHUB_WORKSPACE/onnxruntime"
            cd "$GITHUB_WORKSPACE/onnxruntime"
            cmake -E tar xf /tmp/onnxruntime.nupkg
            mkdir -p include lib
            cp build/native/include/*.h include/
            cp runtimes/linux-x64/native/libonnxruntime.so lib/
            # The library's SONAME is libonnxruntime.so.1.14.1, so the linker
            # needs a file with that name as well.
            cp lib/libonnxruntime.so lib/libonnxruntime.so.1.14.1
            chmod +x lib/libonnxruntime.so lib/libonnxruntime.so.1.14.1
          fi
          echo "ONNXRUNTIME_DIR=$GITHUB_WORKSPACE/onnxruntime" >> "$GITHUB_ENV"

      - name: Verify Wine 7 CPU patch
        run: |
          # This patch is the entire point of this fork; never let a rebase or
          # fuzz failure silently produce a build without it.
          grep -q 'Wine 7 semantics: WINE_CPU_TOPOLOGY must contain' \
            wine/dlls/ntdll/unix/system.c
          ! grep -q 'performance_cores\|/sys/devices/cpu_core/cpus' \
            wine/dlls/ntdll/unix/system.c

      - name: Verify Wine 7 sync semantics
        run: |
          # The yield/delay/signal-and-wait restore is what closes the remaining
          # Persona 5 Royal CPU regression; never let it regress silently.
          grep -q 'Wine 7 semantics: a yield is always reported' \
            wine/dlls/ntdll/unix/sync.c
          grep -q 'Wine 7 used usleep(0) here' \
            wine/dlls/ntdll/unix/sync.c
          ! grep -q 'RUSAGE_THREAD' \
            wine/dlls/ntdll/unix/sync.c
          grep -q 'Wine 7 always performed the signal and wait atomically' \
            wine/dlls/ntdll/unix/sync.c

      - name: Verify Wine 7 IPv6 forwarding fast path
        run: |
          # P5R polls the IPv6 forwarding table from a network worker thread.
          # The Wine 7 fast path must not be silently lost to an upstream rebase.
          grep -q 'Wine 7 returned an empty IPv6 forwarding table' \
            wine/dlls/nsiproxy.sys/ip.c
          grep -A4 'Wine 7 returned an empty IPv6 forwarding table' \
            wine/dlls/nsiproxy.sys/ip.c | grep -q 'return STATUS_SUCCESS;'

      - name: Verify fsync default
        run: |
          # Persona 5 Royal: the build must default to fsync, not ntsync.
          grep -q 'P5R build: default to the Wine 7-era fsync backend' \
            proton
          grep -q 'PROTON_ENABLE_NTSYNC' \
            proton
          grep -q 'self.env\["PROTON_NO_NTSYNC"\] = "1"' \
            proton
          grep -q 'self.env\["PROTON_NO_NTSYNC"\] = ""' \
            proton

      - name: Verify Wine 7 heap in-place resize
        run: |
          # The HeapReAlloc backport is part of the remaining Persona 5 Royal
          # CPU regression; never let a rebase or patch drop it.
          grep -q 'Wine 7 resized in place within the block' \
            wine/dlls/ntdll/heap.c
          ! grep -q 'as native LFH does it with different block size' \
            wine/dlls/ntdll/heap.c

      - name: Verify Wine 7 no-LFH heap
        run: |
          # The HeapReAlloc backport is part of the remaining Persona 5 Royal
          # CPU regression; never let a rebase or patch drop it.
          grep -q 'Wine 7 had no Low Fragmentation Heap' \
            wine/dlls/ntdll/heap.c
          ! grep -q 'WriteRelease( &bin->enabled, TRUE )' \
            wine/dlls/ntdll/heap.c
          ! grep -q 'RtlSetHeapInformation( heap, HeapCompatibilityInformation' \
            wine/dlls/ntdll/heap.c

      - name: Verify Wine 7 never uses CLOCK_MONOTONIC_RAW
        run: |
          # Proton 7 never queried the non-monotonic CLOCK_MONOTONIC_RAW for the
          # Win32 monotonic clock; the newer Wine base picked the raw clock again.
          # Never let that slip back in.
          ! grep -q '#ifdef CLOCK_MONOTONIC_RAW' \
            wine/dlls/ntdll/unix/sync.c
          ! grep -q '#ifdef CLOCK_MONOTONIC_RAW' \
            wine/server/request.c

      - name: Configure
        working-directory: build
        run: |
          ../configure.sh \
            --build-name="${{ steps.build_name.outputs.name }}" \
            --no-proton-sdk

      - name: Build
        working-directory: build
        run: make -j"$(nproc)" redist

      - name: Fix version stamp
        # git describe --tags returns nothing on this fork (no reachable tags),
        # so the Makefile writes "<timestamp> " instead of "<timestamp> NAME".
        # Restore the build name in the tarball and regenerate its checksums.
        working-directory: build
        run: |
          set -eu
          name="${{ steps.build_name.outputs.name }}"
          tar -xzf "$name.tar.gz"
          stamp=$(awk '{print $1}' "$name/version")
          printf '%s %s\n' "$stamp" "$name" > "$name/version"
          rm -f "$name.tar.gz" "$name.sha512sum" SHA256SUMS
          tar -czf "$name.tar.gz" "$name"
          sha512sum "$name.tar.gz" > "$name.sha512sum"
          sha256sum "$name.tar.gz" "$name.sha512sum" > SHA256SUMS
          echo "version stamp: $(cat "$name/version")"

      - name: Report ccache stats
        if: always()
        run: ccache -s || true

      # Save with `always()` so a failed or cancelled build still contributes
      # its successfully compiled objects to the next run. Each run gets a
      # unique key so save never conflicts with an existing cache entry.
      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /github/home/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Save cargo registry
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /github/home/.cargo
          key: ${{ steps.cargo-restore.outputs.cache-primary-key }}

      - name: Save onnxruntime
        # Fixed key already exists after the first run, so only save on a miss.
        if: always() && steps.onnxruntime-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: onnxruntime
          key: ${{ steps.onnxruntime-restore.outputs.cache-primary-key }}

      - name: Save submodule git objects
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .git/modules
          key: ${{ steps.submodules-restore.outputs.cache-primary-key }}

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build_name.outputs.name }}
          path: |
            build/${{ steps.build_name.outputs.name }}.tar.gz
            build/${{ steps.build_name.outputs.name }}.sha512sum
            build/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.name }}
          path: artifacts

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --latest \
              --title "$GITHUB_REF_NAME Released" --notes-from-tag --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
