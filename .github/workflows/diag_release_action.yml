name: Diag Release Action

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'GE-Proton*'
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.build_name.outputs.name }}
    steps:
      - id: build_name
        run: echo "name=test" >> "$GITHUB_OUTPUT"
      - run: echo ok

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.name }}
          path: artifacts
      - run: echo ok
